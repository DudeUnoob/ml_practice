[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-from-scratch"
version = "0.1.0"
description = "A ground-up deep learning learning path with NumPy implementations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
gpt = [
    "torch>=2.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "httpx>=0.27",
]
notebooks = [
    "jupyter",
    "matplotlib",
    "pandas",
    "scikit-learn",
    "seaborn",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
